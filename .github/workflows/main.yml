name: Extract and Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

jobs:
  extract-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Extract ZIP file
        run: |
          set -e
          test -f "omnirouter-ai (2).zip"
          unzip -o "omnirouter-ai (2).zip"
          echo "ZIP extraction completed."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties
          test -d app

      - name: Pin CI-safe KSP version
        run: |
          set -e
          test -f gradle/libs.versions.toml
          sed -i 's/googleDevtoolsKsp = "2\.3\.5"/googleDevtoolsKsp = "2.3.6"/' gradle/libs.versions.toml
          grep 'googleDevtoolsKsp' gradle/libs.versions.toml

      - name: Commit and push extracted files
        run: |
          set -e
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract and sync Android project [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate missing Gradle wrapper
        run: |
          set -e
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            GRADLE_VERSION=$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-bin.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -n1)
            test -n "$GRADLE_VERSION"
            echo "Generating Gradle wrapper for Gradle $GRADLE_VERSION"
            gradle --no-daemon wrapper --gradle-version "$GRADLE_VERSION"
            chmod +x ./gradlew
          fi
          test -x ./gradlew
          ./gradlew --version

      - name: Generate debug keystore
        run: |
          set -e
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug --stacktrace --no-parallel

      - name: Verify APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniRouter-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
